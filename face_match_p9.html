<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praktikum P9 - Face Matching</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #f4f6f9;
    color: #1e293b;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

h1 { color: #0f172a; }
.subtitle { color: #64748b; }

#status {
    padding: 12px;
    background: #fef3c7;
    color: #92400e;
    border-radius: 6px;
    margin-bottom: 20px;
}

#status.ready {
    background: #dcfce7;
    color: #166534;
}

#status.error {
    background: #fee2e2;
    color: #991b1b;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    border: 1px solid #e2e8f0;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    background: #f8fafc;
}

canvas {
    width: 200px;
    height: 200px;
    max-width: 100%;
    object-fit: contain;
    background: #0f172a;
    border-radius: 6px;
    margin-top: 10px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    background: #f1f5f9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.result-box {
    padding: 20px;
    border-radius: 8px;
    border: 2px solid #cbd5e1;
    display: none;
    overflow-x: auto;
}

.match {
    border-color: #22c55e;
    background: #f0fdf4;
}

.no-match {
    border-color: #ef4444;
    background: #fef2f2;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: .9rem;
}

th, td {
    border: 1px solid #cbd5e1;
    padding: 8px 12px;
    text-align: left;
}

th { background: #e2e8f0; }

@media(max-width:650px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Implementasi Face Matching (Pertemuan 9)</h1>

<p class="subtitle">
Ekstraksi Deskriptor Warna (Histogram RGB),
Bentuk (Momen Hu), dan Verifikasi Ambang NCC
</p>

<div id="status">Memuat OpenCV.js...</div>

<div class="grid">

    <div class="card">
        <strong>Wajah Referensi (Objek A)</strong>
        <br><br>
        <input type="file" id="inputA" accept="image/*" disabled>
        <br>
        <canvas id="canvasA" width="200" height="200"></canvas>
    </div>

    <div class="card">
        <strong>Wajah Uji (Objek B)</strong>
        <br><br>
        <input type="file" id="inputB" accept="image/*" disabled>
        <br>
        <canvas id="canvasB" width="200" height="200"></canvas>
    </div>

</div>

<div class="controls">

    <label>
        <strong>Threshold:</strong>
        <span id="threshVal">0.85</span>
    </label>

    <input type="range"
        id="threshold"
        min="0.50"
        max="0.99"
        step="0.01"
        value="0.85">

    <button id="btnVerify" disabled>
        Jalankan Verifikasi Wajah
    </button>

</div>

<div id="resultBox" class="result-box">

    <h2 id="decisionText"></h2>
    <p id="scoreDetail"></p>

    <table>
        <thead>
            <tr>
                <th>Deskriptor / Metrik</th>
                <th>Objek A</th>
                <th>Objek B</th>
                <th>Skor NCC</th>
            </tr>
        </thead>

        <tbody id="metricsBody"></tbody>
    </table>

</div>

</div>

<script async
src="https://docs.opencv.org/4.8.0/opencv.js"
onload="onOpenCvReady()">
</script>

<script>

let imgLoadedA = false;
let imgLoadedB = false;
let cvReady = false;

const statusBox = document.getElementById("status");

// MENYIAPKAN OPENCV
function onOpenCvReady() {

    if (typeof cv === "undefined") {
        statusBox.textContent = "OpenCV.js gagal dimuat.";
        statusBox.className = "error";
        return;
    }

    cv.onRuntimeInitialized = function() {

        cvReady = true;

        statusBox.textContent =
            "OpenCV.js Siap! Silakan unggah kedua gambar.";

        statusBox.className = "ready";

        document.getElementById("inputA").disabled = false;
        document.getElementById("inputB").disabled = false;

        cekTombol();

    };
}

// MENGATUR THRESHOLD
document.getElementById("threshold")
.addEventListener("input", function(e) {

    document.getElementById("threshVal").textContent =
        Number(e.target.value).toFixed(2);

});

// CEK TOMBOL VERIFIKASI
function cekTombol() {

    document.getElementById("btnVerify").disabled =
        !(imgLoadedA && imgLoadedB && cvReady);

}

// MEMUAT GAMBAR
function loadImage(inputId, canvasId, flag) {

    document.getElementById(inputId)
    .addEventListener("change", function(e) {

        const file = e.target.files[0];

        if (!file) return;

        const img = new Image();

        img.onload = function() {

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");

            canvas.width = 200;
            canvas.height = 200;

            ctx.clearRect(0, 0, 200, 200);
            ctx.drawImage(img, 0, 0, 200, 200);

            URL.revokeObjectURL(img.src);

            if (flag === "A") imgLoadedA = true;
            if (flag === "B") imgLoadedB = true;

            cekTombol();

        };

        img.onerror = function() {

            alert("Gambar tidak dapat dibaca.");

        };

        img.src = URL.createObjectURL(file);

    });

}

loadImage("inputA", "canvasA", "A");
loadImage("inputB", "canvasB", "B");

// MENGHITUNG MOMEN HU SECARA MANUAL
function hitungHu(m) {

    const n20 = m.nu20;
    const n02 = m.nu02;
    const n11 = m.nu11;
    const n30 = m.nu30;
    const n03 = m.nu03;
    const n12 = m.nu12;
    const n21 = m.nu21;

    const a = n30 - 3 * n12;
    const b = 3 * n21 - n03;
    const c = n30 + n12;
    const d = n21 + n03;

    return [

        n20 + n02,

        Math.pow(n20 - n02, 2) +
        4 * Math.pow(n11, 2),

        Math.pow(a, 2) + Math.pow(b, 2),

        Math.pow(c, 2) + Math.pow(d, 2),

        a * c * (c*c - 3*d*d) +
        b * d * (3*c*c - d*d),

        (n20 - n02) * (c*c - d*d) +
        4 * n11 * c * d,

        b * c * (c*c - 3*d*d) -
        a * d * (3*c*c - d*d)

    ];

}

// EKSTRAKSI FITUR GAMBAR
function ekstrakFiturObjek(canvasId) {

    let src = cv.imread(canvasId);
    let gray = new cv.Mat();

    let binary = null;
    let contours = null;
    let hierarchy = null;

    let histVec = [];

    try {

        // MENGUBAH GAMBAR MENJADI GRAYSCALE
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

        cv.GaussianBlur(
            gray,
            gray,
            new cv.Size(5, 5),
            0
        );

        // 1. HISTOGRAM RGB
        // Menghitung histogram langsung dari piksel gambar

        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext("2d");

        const pixels = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        ).data;

        const histograms = [
            new Array(64).fill(0),
            new Array(64).fill(0),
            new Array(64).fill(0)
        ];

        for (let i = 0; i < pixels.length; i += 4) {

            const r = pixels[i];
            const g = pixels[i + 1];
            const b = pixels[i + 2];

            histograms[0][Math.min(63, Math.floor(r / 4))]++;
            histograms[1][Math.min(63, Math.floor(g / 4))]++;
            histograms[2][Math.min(63, Math.floor(b / 4))]++;

        }

        // NORMALISASI HISTOGRAM
        for (let c = 0; c < 3; c++) {

            let norm = Math.sqrt(
                histograms[c].reduce(
                    (sum, value) => sum + value * value,
                    0
                )
            );

            for (let i = 0; i < 64; i++) {

                histVec.push(
                    norm > 0
                    ? histograms[c][i] / norm
                    : 0
                );

            }

        }

        // 2. MOMEN HU DAN KONTUR

        binary = new cv.Mat();
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();

        cv.threshold(
            gray,
            binary,
            0,
            255,
            cv.THRESH_BINARY + cv.THRESH_OTSU
        );

        console.log("CEK binary:", binary instanceof cv.Mat);
        console.log("CEK contours:", contours instanceof cv.MatVector);
        console.log("CEK hierarchy:", hierarchy instanceof cv.Mat);
        console.log("CEK findContours:", typeof cv.findContours);

        cv.findContours(
            binary,
            contours,
            hierarchy,
            cv.RETR_EXTERNAL,
            cv.CHAIN_APPROX_SIMPLE
        );

        let maxArea = 0;
        let maxIdx = -1;

        for (let i = 0; i < contours.size(); i++) {

            let contour = contours.get(i);
            let area = cv.contourArea(contour);

            if (area > maxArea) {

                maxArea = area;
                maxIdx = i;

            }

            contour.delete();

        }

        let huVec = new Array(7).fill(0);

        let bentukInfo = {
            luas: 0,
            keliling: 0,
            rasioAspek: 0
        };

        if (maxIdx !== -1 && maxArea > 0) {

            let konturUtama = contours.get(maxIdx);

            let keliling = cv.arcLength(
                konturUtama,
                true
            );

            let rect = cv.boundingRect(konturUtama);

            bentukInfo = {

                luas: maxArea.toFixed(0),

                keliling: keliling.toFixed(1),

                rasioAspek:
                    rect.height > 0
                    ? (rect.width / rect.height).toFixed(2)
                    : 0

            };

            const momen = cv.moments(
                konturUtama,
                false
            );

            const hu = hitungHu(momen);

            for (let i = 0; i < 7; i++) {

                const val = hu[i];

                huVec[i] =
                    val !== 0 && Number.isFinite(val)
                    ? -Math.sign(val) * Math.log10(Math.abs(val))
                    : 0;

            }

            konturUtama.delete();

        }

        return {

            histVec,
            huVec,
            bentukInfo

        };

    } finally {

        src.delete();
        gray.delete();

        if (binary) binary.delete();
        if (contours) contours.delete();
        if (hierarchy) hierarchy.delete();

    }

}

// NORMALIZED CROSS-CORRELATION
function ncc(vecA, vecB) {

    if (
        vecA.length !== vecB.length ||
        vecA.length === 0
    ) {

        return 0;

    }

    let dot = 0;
    let normA = 0;
    let normB = 0;

    for (let i = 0; i < vecA.length; i++) {

        dot += vecA[i] * vecB[i];

        normA += vecA[i] * vecA[i];

        normB += vecB[i] * vecB[i];

    }

    if (normA === 0 || normB === 0) return 0;

    return dot / (Math.sqrt(normA) * Math.sqrt(normB));

}

// VERIFIKASI WAJAH
function verifikasiWajah(fiturA, fiturB, ambang) {

    const skorWarna = ncc(
        fiturA.histVec,
        fiturB.histVec
    );

    const skorBentuk = ncc(
        fiturA.huVec,
        fiturB.huVec
    );

    const skorGabungan =
        (0.6 * skorWarna) +
        (0.4 * skorBentuk);

    return {

        skorWarna,
        skorBentuk,
        skorGabungan,

        keputusan:
            skorGabungan >= ambang
            ? "COCOK"
            : "TIDAK COCOK"

    };

}

// TOMBOL VERIFIKASI
document.getElementById("btnVerify")
.addEventListener("click", function() {

    const box = document.getElementById("resultBox");

    box.style.display = "block";

    try {

        if (!cvReady || !imgLoadedA || !imgLoadedB) {

            throw new Error(
                "OpenCV atau gambar belum siap."
            );

        }

        statusBox.textContent =
            "Sedang menghitung fitur gambar...";

        statusBox.className = "";

        const ambang = Number(
            document.getElementById("threshold").value
        );

        // EKSTRAKSI FITUR OBJEK A DAN B
        const fiturA = ekstrakFiturObjek("canvasA");

        const fiturB = ekstrakFiturObjek("canvasB");

        // MENGHITUNG HASIL VERIFIKASI
        const hasil = verifikasiWajah(
            fiturA,
            fiturB,
            ambang
        );

        box.className =
            "result-box " +
            (
                hasil.keputusan === "COCOK"
                ? "match"
                : "no-match"
            );

        document.getElementById("decisionText").textContent =
            "Keputusan Verifikasi: " + hasil.keputusan;

        document.getElementById("scoreDetail").textContent =
            "Skor Kemiripan Gabungan: " +
            hasil.skorGabungan.toFixed(4) +
            " | Threshold: " +
            ambang.toFixed(2);

        // MENAMPILKAN HASIL METRIK
        document.getElementById("metricsBody").innerHTML = `

            <tr>
                <td>Histogram RGB</td>
                <td>192 fitur</td>
                <td>192 fitur</td>
                <td>${hasil.skorWarna.toFixed(4)}</td>
            </tr>

            <tr>
                <td>Momen Hu</td>

                <td>
                    ${fiturA.huVec.slice(0,3)
                    .map(v => v.toFixed(3)).join(", ")}
                </td>

                <td>
                    ${fiturB.huVec.slice(0,3)
                    .map(v => v.toFixed(3)).join(", ")}
                </td>

                <td>${hasil.skorBentuk.toFixed(4)}</td>
            </tr>

            <tr>
                <td>Geometri Kontur</td>

                <td>
                    Luas: ${fiturA.bentukInfo.luas},
                    Keliling: ${fiturA.bentukInfo.keliling},
                    Rasio: ${fiturA.bentukInfo.rasioAspek}
                </td>

                <td>
                    Luas: ${fiturB.bentukInfo.luas},
                    Keliling: ${fiturB.bentukInfo.keliling},
                    Rasio: ${fiturB.bentukInfo.rasioAspek}
                </td>

                <td>-</td>
            </tr>

        `;

        statusBox.textContent =
            "Pengujian selesai.";

        statusBox.className = "ready";

    } catch (error) {

        console.error(error);

        box.className = "result-box no-match";

        document.getElementById("decisionText").textContent =
            "Terjadi kesalahan saat verifikasi";

        document.getElementById("scoreDetail").textContent =
            error.message;

        statusBox.textContent =
            "Error: " + error.message;

        statusBox.className = "error";

    }

});

</script>

</body>
</html>
